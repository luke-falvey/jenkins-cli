name: Release

# Pushing a tag like `v0.2.0` runs the CI checks, builds static Linux
# binaries for amd64 and arm64, and publishes them as a GitHub release.
# Pull requests that touch the build run the same builds without releasing.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: check tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: build linux-${{ matrix.arch }}
    needs: [ci, version]
    # `version` is skipped for pull requests and manual runs.
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.version.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary is static and runs
        run: |
          bin=target/${{ matrix.target }}/release/jenkins-cli
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          "$bin" --version
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          name="jenkins-cli-${version}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/jenkins-cli README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jenkins-cli-*
          merge-multiple: true
      - name: Combine checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS && cat dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          # Tags with a suffix, like v0.2.0-rc.1, become pre-releases.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}" \
            dist/*.tar.gz dist/SHA256SUMS
